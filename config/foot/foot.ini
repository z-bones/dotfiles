# foot — the terminal sway launches as $term (see config/sway/config).
#
# Until now there was no config here at all: foot ran entirely on its
# compiled-in defaults, which are Solarized dark (background 002b36, foreground
# 839496) — not the pure black that config/alacritty/alacritty.toml uses.

# [colors-dark], not [colors] — the latter is deprecated in this foot version and
# warns on startup. colors-dark is the theme foot uses unless
# initial-color-theme=light is set, which it is not.
[colors-dark]
# Near-black with a violet-blue cast: hue ~251° at only ~7% value, so it reads
# as black until it sits beside a true 000000. This deliberately leaves foot's
# Solarized default (002b36) behind — that stock background is a teal-leaning
# blue, the "dark blueish" tone this replaces.
#
# Foreground is left unset, so it stays at foot's stock 839496. That pairing is
# 6.4:1 against this background; the stock Solarized pairing was only 4.75:1.
background=080611
