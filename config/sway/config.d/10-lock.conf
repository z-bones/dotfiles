# Screen locking and idle handling. Universal — every host, not just laptops.
#
# This used to come from the distro at /usr/share/sway/config.d/90-swayidle.conf.
# The main config no longer includes that directory (see the long note on the
# include there), so on a Fedora Sway spin — where that file was the ONLY thing
# locking or blanking the screen — dropping it would have left the machine
# never locking at all. It lives here now, owned by us, identical on both hosts.
#
# It is deliberately NOT in laptop.conf. A desktop wants an idle lock just as
# much, and two files declaring `exec swayidle` would start two daemons.

### The lock command
#
# Guarded, because several paths can request a lock for one event: swayidle's
# before-sleep hook, the logind lock signal, and the lid binding in laptop.conf.
# swaylock has no single-instance guard and two instances stack — you would have
# to type the password twice. pgrep makes every request after the first a no-op.
set $lock pgrep -x swaylock > /dev/null || swaylock -f -c 000000

### Idle behaviour: lock at 5 min, screens off at 10, lock before sleep
#
# The lock/unlock handlers are what make `loginctl lock-session` work — without
# them the session lock from other tools does nothing. SIGUSR1 is swaylock's
# documented "unlock now" signal, sent when logind reports the session unlocked.
exec swayidle -w \
    timeout 300  '$lock' \
    timeout 600  'swaymsg "output * power off"' \
        resume   'swaymsg "output * power on"' \
    before-sleep '$lock' \
    lock         '$lock' \
    unlock       'pkill -xu "$USER" -SIGUSR1 swaylock'
