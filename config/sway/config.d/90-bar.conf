# Intentionally empty — and, as of the include rework, now inert.
#
# This file used to do real work: the main config pulled in
# /usr/share/sway/config.d via layered-include, and since that helper matches on
# basename with the user directory last, an empty 90-bar.conf here replaced the
# distro's /usr/share/sway/config.d/90-bar.conf and its competing
# `bar { swaybar_command waybar }`.
#
# The main config no longer includes /usr/share/sway/config.d at all (see the
# long comment on the include there), so the distro drop-in can never load and
# there is nothing left to neutralise. The bar is declared in the main config.
#
# Kept rather than deleted because it costs nothing and is still the correct
# override if /usr/share/sway/config.d is ever added back to the include list.
# Do NOT add a bar block here — that would produce a second bar.
#
# The filename must stay 90-bar.conf — the override is by basename.
