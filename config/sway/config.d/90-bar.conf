# Intentionally empty.
#
# This file exists solely to neutralise the distro's bar drop-in at
# /usr/share/sway/config.d/90-bar.conf (owned by sway-config-fedora), which
# declares its own `bar { swaybar_command waybar }`.
#
# layered-include matches on basename with the user directory last, so this
# file replaces the distro one. The actual bar is declared in the main sway
# config, which works whether or not layered-include exists.
#
# Do NOT add a bar block here. That would produce a second bar on systems where
# config.d loads, and no bar at all on systems where it doesn't.
#
# The filename must stay 90-bar.conf — the override is by basename.
