# Status Bar: waybar
#
# Shipped by the dotfiles rather than relying on sway-config-fedora, which
# provides /usr/share/sway/config.d/90-bar.conf on the Fedora Sway spin but is
# absent when sway is added by hand to a GNOME install — leaving no bar at all.
#
# The filename matters. layered-include keys on basename and the user directory
# is the last pattern, so this file REPLACES the distro drop-in rather than
# adding a second bar. Renaming it would give you two bars on the Sway spin.
#
# Requires: waybar (installed via SWAY_PACKAGES in scripts/packages.sh)

bar {
    swaybar_command waybar
}
