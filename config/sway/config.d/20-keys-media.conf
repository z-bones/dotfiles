# Volume and media keys. Universal — a desktop keyboard has these too.
#
# Ported from the distro drop-ins /usr/share/sway/config.d/60-bindings-volume.conf
# and 60-bindings-media.conf, which the main config no longer includes. Without
# this file the volume and playback keys are dead on a Fedora Sway spin.
#
# These were in laptop.conf, which was wrong twice over: they are not
# laptop-specific, and on the Sway spin the distro drop-in was silently winning
# anyway. One owner now, both hosts.

### Volume
#
# wpctl (wireplumber, in packages.sh) rather than the distro's
# /usr/libexec/sway/volume-helper — that helper ships in sway-config-fedora,
# which we deliberately do not install.
#
# --locked so the keys still work at the lock screen.
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute        exec wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute     exec wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle

### Playback (playerctl, in packages.sh)
#
# Play/pause and stop are --locked so music can be silenced without unlocking;
# the rest are not, so a locked screen cannot be used to skim someone's library.
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioStop exec playerctl stop
bindsym XF86AudioNext    exec playerctl next
bindsym XF86AudioPrev    exec playerctl previous
bindsym XF86AudioPause   exec playerctl pause
bindsym XF86AudioForward exec playerctl position +10
bindsym XF86AudioRewind  exec playerctl position -10
