# Window rules. Universal.
#
# Ported from the distro drop-ins /usr/share/sway/config.d/50-rules-*.conf,
# which the main config no longer includes.

### Browsers
#
# The mark is the point: it lets one inhibit_idle rule cover every browser
# without repeating the criteria. Fullscreen video then holds off the 5-minute
# idle lock in 10-lock.conf — the reason this rule is worth porting at all.
for_window [app_id="firefox"]           mark Browser
for_window [app_id="zen"]               mark Browser
for_window [app_id="chromium-browser"]  mark Browser
for_window [app_id="brave-browser"]     mark Browser
for_window [class="firefox"]            mark Browser
for_window [class="Chromium-browser"]   mark Browser
for_window [class="Brave-browser"]      mark Browser
for_window [con_mark="Browser"] inhibit_idle fullscreen

# Firefox's screen-sharing indicator is a tiny always-on-top strip. Tiled it
# eats half a workspace.
for_window [app_id="firefox" title="Firefox — Sharing Indicator"] floating enable

### Dialogs that should float and centre
#
# pavucontrol is waybar's pulseaudio on-click handler, so this one fires often.
for_window [app_id="pavucontrol"]    floating enable, move position center
for_window [app_id="pavucontrol-qt"] floating enable, move position center

# Polkit agents — whichever one 40-autostart.conf found. Listed for all three
# because the agent differs by host: lxqt on the Sway spin, kde on Plasma.
for_window [app_id="lxqt-policykit-agent"] floating enable, move position center
for_window [app_id="polkit-kde-authentication-agent-1"] floating enable, move position center
for_window [app_id="polkit-gnome-authentication-agent-1"] floating enable, move position center
