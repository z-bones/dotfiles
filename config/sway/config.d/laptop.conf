# Laptop-only sway settings.
#
# symlinks.sh links this into ~/.config/sway/config.d/ only when the host has a
# battery, so the desktop never picks it up. Uses `input type:...` rather than
# device identifiers so it works on any laptop without hand-editing.

### Touchpad
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
    scroll_method two_finger
    scroll_factor 0.8
    pointer_accel -0.3
}

input type:keyboard {
    xkb_options ctrl:nocaps
}

### Locking
#
# Guarded, because two paths can lock for a single lid close: swayidle's
# before-sleep hook and the lid binding below. swaylock has no single-instance
# guard, and two instances stack — you would have to type the password twice.
# pgrep makes a second lock request a no-op.
set $lock pgrep -x swaylock > /dev/null || swaylock -f -c 000000

### Lid switch
#
# Closing the lid suspends the machine: that is logind's job, not sway's
# (HandleLidSwitch=suspend, the shipped default — deliberately left alone).
# swayidle's before-sleep hook below is what locks on the way down; it holds a
# delay inhibitor, so the lock is up before the machine actually sleeps. That
# ordering is why locking is NOT done here — a bare `exec swaylock` on lid close
# races the suspend instead of blocking it.
#
# This binding exists only to cover the gap where logind will not suspend:
# for ~30s after a resume it ignores the lid entirely (its holdoff window), so a
# quick close-open would otherwise leave the desktop unlocked and lit.
bindswitch --reload --locked lid:on  exec $lock
bindswitch --reload --locked lid:off exec true

### Idle behaviour: lock at 5 min, screens off at 10, lock before sleep
exec swayidle -w \
    timeout 300  '$lock' \
    timeout 600  'swaymsg "output * power off"' \
        resume   'swaymsg "output * power on"' \
    before-sleep '$lock'

### Brightness and volume keys (brightnessctl ships in packages.sh)
#
# brightnessctl writes via logind's D-Bus SetBrightness, so these need no udev
# rule and no video group — /sys/class/backlight is root-owned and stays that way.
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86AudioRaiseVolume  exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume  exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute         exec wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute      exec wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
