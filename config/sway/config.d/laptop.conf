# Laptop-only sway settings.
#
# symlinks.sh links this into ~/.config/sway/config.d/ only when the host has a
# battery, so the desktop never picks it up. Uses `input type:...` rather than
# device identifiers so it works on any laptop without hand-editing.
#
# Keep this file to things a desktop genuinely does not want. Screen locking
# (10-lock.conf) and the volume and media keys (20-keys-media.conf) used to live
# here and no longer do — a desktop wants both, and duplicating them across two
# drop-ins would have started a second swayidle.

### Touchpad
input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
    middle_emulation enabled
    scroll_method two_finger
    scroll_factor 0.8
    pointer_accel -0.3
}

input type:keyboard {
    xkb_options ctrl:nocaps
}

### Lid switch
#
# Closing the lid suspends the machine: that is logind's job, not sway's
# (HandleLidSwitch=suspend, the shipped default — deliberately left alone).
# swayidle's before-sleep hook in 10-lock.conf is what locks on the way down; it
# holds a delay inhibitor, so the lock is up before the machine actually sleeps.
# That ordering is why locking is NOT done here — a bare `exec swaylock` on lid
# close races the suspend instead of blocking it.
#
# This binding exists only to cover the gap where logind will not suspend:
# for ~30s after a resume it ignores the lid entirely (its holdoff window), so a
# quick close-open would otherwise leave the desktop unlocked and lit.
#
# $lock is defined in 10-lock.conf, which the glob include loads first — the
# numeric prefix is what guarantees that order.
bindswitch --reload --locked lid:on  exec $lock
bindswitch --reload --locked lid:off exec true

### Screen brightness (brightnessctl ships in packages.sh)
#
# brightnessctl writes via logind's D-Bus SetBrightness, so these need no udev
# rule and no video group — /sys/class/backlight is root-owned and stays that way.
bindsym --locked XF86MonBrightnessUp   exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-

### Keyboard backlight
#
# The fn row emits KEY_KBDILLUMDOWN/UP (kernel 229/230), which xkb maps to these
# XF86KbdBrightness* keysyms — note they are NOT XF86KbdBrightness's display
# equivalents and NOT XF86KbdLightOnOff, which is the separate toggle keycode.
#
# -c leds is required. The keyboard LED is a leds-class device (kbd_backlight),
# not a backlight-class one; without -c, brightnessctl only ever sees
# apple-panel-bl and these keys would silently dim the screen instead.
bindsym --locked XF86KbdBrightnessUp   exec brightnessctl -d kbd_backlight -c leds set 10%+
bindsym --locked XF86KbdBrightnessDown exec brightnessctl -d kbd_backlight -c leds set 10%-

# Toggle keycode. Bound for completeness — the internal keyboard advertises
# KEY_KBDILLUMTOGGLE, but there is no physical key for it on this model, so this
# only fires from an external Apple keyboard that has one.
bindsym --locked XF86KbdLightOnOff exec [ "$(brightnessctl -d kbd_backlight -c leds get)" -gt 0 ] && brightnessctl -d kbd_backlight -c leds set 0 || brightnessctl -d kbd_backlight -c leds set 50%
