# Session autostart. Universal.
#
# Ported from the distro drop-ins /usr/share/sway/config.d/95-*.conf, which the
# main config no longer includes. Every exec here is guarded, because unlike the
# distro files — which could assume their own package set — these run on both a
# Fedora Sway spin and a Plasma host with sway added by hand.

### Polkit authentication agent
#
# See the script for why this probes rather than hardcodes an agent path.
#
# exec_always, unlike the two below: the script is guarded against starting a
# second agent, so re-running it on `swaymsg reload` is free, and it means a
# reload is enough to get an agent on a host that had none. Plain `exec` would
# make that wait for the next login.
exec_always $HOME/.config/sway/polkit-agent.sh

### XDG autostart
#
# Starts the .desktop entries in ~/.config/autostart and /etc/xdg/autostart —
# without this they never run under sway. wait-sni-ready holds until the tray is
# up, so applets that want a system tray do not start before waybar's tray
# exists and end up invisible.
#
# Both halves come from sway-systemd. Guarded on the helper because that package
# is not guaranteed; where it is absent the target does not exist either.
exec '[ -x /usr/libexec/sway-systemd/wait-sni-ready ] && /usr/libexec/sway-systemd/wait-sni-ready && systemctl --user start sway-xdg-autostart.target'

### XDG user directories
#
# Creates and refreshes ~/Downloads, ~/Documents and friends, and writes
# ~/.config/user-dirs.dirs, which is what file pickers read.
exec 'command -v xdg-user-dirs-update > /dev/null && xdg-user-dirs-update'
