# Android emulator under a tiling WM.
#
# The emulator is a multi-window Qt/XWayland app. All its windows report
# class="Emulator" (instance "qemu-system-x86_64"), but they play different roles
# and need opposite treatment:
#
#   "Android Emulator - <avd>:<port>"  the device screen  -> tile it
#   "Emulator"                         toolbars           -> must float
#   "Extended Controls - <avd>:<port>" settings panel     -> must float
#
# If the toolbars get tiled they are laid out as siblings of the device window and
# end up drawn over it — a 644x50 strip lands mid-viewport and reads as a black
# bar across the screen. If the device window floats, it overlaps whatever is
# tiled behind it. Hence: device tiled, chrome floating.

# Device screen: tiled into workspace 2 alongside Cursor, taking the right quarter.
# Matched by title rather than `assign` because the window is mapped with a
# generic title and renamed once the AVD is known — `assign` only evaluates once,
# at map time, and would miss it.
for_window [class="Emulator" title="^Android Emulator"] floating disable, move to workspace 2, resize set width 25 ppt

# Emulator toolbars: hidden in the scratchpad, not killed.
#
# DO NOT use `kill` here. The side toolbar (75x506, window_type=utility) is
# load-bearing despite being a transient child of the device window — killing it
# shuts the whole emulator down, so a `kill` rule would terminate the emulator on
# every launch. `move scratchpad` hides it with no effect on the running VM.
#
# window_type is the discriminator, not title: the toolbars are "utility" while
# the device window is "normal", so this can never match the device even if it is
# briefly mapped with a generic title.
for_window [class="Emulator" title="^Emulator$" window_type="utility"] floating enable, border none, move scratchpad

# Extended Controls stays visible when opened — excluded from the rule above by
# its title. Close it with $mod+Shift+q while focused.
for_window [class="Emulator" title="^Extended Controls"] floating enable

# Toolbar functions from the CLI instead (adb is on PATH inside the container):
#   back/home/recents  adb shell input keyevent KEYCODE_BACK|KEYCODE_HOME|KEYCODE_APP_SWITCH
#   power / volume     adb shell input keyevent KEYCODE_POWER|KEYCODE_VOLUME_UP|KEYCODE_VOLUME_DOWN
#   rotate             adb shell settings put system accelerometer_rotation 0
#                      adb shell settings put system user_rotation 0|1|2|3
#   screenshot         adb exec-out screencap -p > shot.png
# To get the toolbar back for one session: swaymsg scratchpad show

# No key bindings here on purpose. Extended Controls closes with the existing
# $mod+Shift+q (kill) while it is focused. Do not bind $mod+Shift+e — it is
# already the "exit sway" prompt at line 113 of the main config, and a duplicate
# bindsym makes sway report a config error on reload.
